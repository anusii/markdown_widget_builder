name: markdown_widget_builder
description: "Widget builder for surveys defined using markdown-like syntax."
version: 0.0.5
homepage: https://github.com/anusii/markdown_widget_builder

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  audioplayers: ^6.4.0
  file_picker: ^10.1.2
  flutter_markdown: ^0.7.7
  http: ^1.3.0
  media_kit: ^1.2.0
  media_kit_libs_video: ^1.0.6
  media_kit_video: ^1.3.0
  path: ^1.9.1
  universal_html: ^2.2.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

dev_dependencies:
  custom_lint: ^0.7.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  import_order_lint: ^0.1.0

#   dart_code_metrics:
